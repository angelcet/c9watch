[package]
name = "c9watch"
version = "0.8.1"
description = "Monitor and control all your Claude Code sessions from one place"
authors = ["minchenlee"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "c9watch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["gui", "cli"]
gui = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-notification",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-updater",
    "dep:tauri-plugin-process",
    "dep:tauri-plugin-sharekit",
    "dep:axum",
    "dep:tokio",
    "dep:rand",
    "dep:qr2term",
    "dep:rust-embed",
    "dep:mime_guess",
    "dep:base64",
    "dep:tauri-nspanel",
]
cli = ["dep:clap", "dep:tokio", "dep:fs2"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
# ── Core (always included) ───────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
anyhow = "1.0"
thiserror = "1.0"
dirs = "5.0"
chrono = "0.4"
libc = "0.2.180"
uuid = { version = "1", features = ["v4"] }
# Used by the always-compiled `session::sanitize` module, so it must be a
# core (non-optional) dependency rather than gated behind the `cli` feature.
regex = "1"

# ── GUI-only dependencies ────────────────────────────────────────────
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-sharekit = { version = "0.3", optional = true }
axum = { version = "0.7", features = ["ws"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "io-util", "process", "signal", "fs", "time", "macros"], optional = true }
rand = { version = "0.8", optional = true }
qr2term = { version = "0.3", optional = true }
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }
base64 = { version = "0.22", optional = true }

# ── CLI-only dependencies ────────────────────────────────────────────
clap = { version = "4", features = ["derive"], optional = true }
wait-timeout = "0.2"
# Cross-platform advisory file locking for the PM daemon pid file (replaces the
# Unix-only libc::flock). Used by the `cli` feature's daemon launcher.
fs2 = { version = "0.4", optional = true }

[dev-dependencies]
tempfile = "3"

# ── macOS GUI-only ───────────────────────────────────────────────────
# tauri-nspanel provides NSPanel support for the popover (above fullscreen apps).
# It depends on tauri (gated behind the gui feature) and on AppKit/objc2, so it
# only compiles on macOS. Scope it to the macOS target so the `gui` feature can
# still build on Windows/Linux; the `dep:tauri-nspanel` activation in `gui` is a
# no-op on non-macOS targets where this dependency does not exist.
[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "da9c9a8d4eb7f0524a2508988df1a7d9585b4904", optional = true }

# ── Windows-only ──────────────────────────────────────────────────────
# Win32 APIs for process liveness (OpenProcess) and window activation
# (SetForegroundWindow/ShowWindow) — the Windows equivalents of the Unix
# `libc::kill(pid,0)` checks and the macOS AppleScript / Linux xdotool focus.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_UI_WindowsAndMessaging",
] }
